services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-college-copilot-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - CLIENT_ORIGIN=*
      - JWT_SECRET=${JWT_SECRET:-ai_college_copilot_prod_jwt_secret_token_secure_2026_production}
      - DB_SSL_CA_PATH=/app/ca.pem
    volumes:
      - ./backend/ca.pem:/app/ca.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - copilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-college-copilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - copilot-network

networks:
  copilot-network:
    driver: bridge
