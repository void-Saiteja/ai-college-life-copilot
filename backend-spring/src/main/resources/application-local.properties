# ===================================================================
# Local Testing Profile: Isolated Local MySQL
# Active Profile: local
# ===================================================================

# Local Secrets Configuration (Persisted, Git-Ignored, Not Packaged in JAR)
spring.config.import=optional:file:./local-secrets.properties,optional:file:./backend-spring/local-secrets.properties,optional:file:../local-secrets.properties


# Explicit Local MySQL Coordinates
DB_HOST=localhost
DB_PORT=3306
DB_NAME=ai_college_copilot_test
DB_USER=root
DB_PASSWORD=${LOCAL_DB_PASSWORD:}
DB_SSL=false
DB_SSL_CA_CERT=
DB_SSL_CA_PATH=

# Spring Datasource Direct Configuration (Overrides default URL)
spring.datasource.url=jdbc:mysql://localhost:3306/ai_college_copilot_test?sslMode=DISABLED&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Tuning: Fail immediately on startup if local DB connection or auth fails
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=5000

# STRICT JPA / Hibernate Safety: Do NOT create, alter, or drop tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Management Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
